<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="EndpointForge checks that each device still meets its security baseline, and records every change.">
<title>EndpointForge</title>
<style>
  :root {
    --paper:#ffffff; --mist:#f4f4f6; --ink:#000000; --body:#18181a; --quiet:#5f6066;
    --hair:#d9d9de; --link:#0a5fd0; --ok:#1c7c3c; --bad:#c4271d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#000000; --mist:#111113; --ink:#ffffff; --body:#f2f2f4; --quiet:#a0a0a8;
      --hair:#2c2c30; --link:#5aa2ff; --ok:#45c46f; --bad:#ff6a5e;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body {
    margin:0; background:var(--paper); color:var(--body);
    font:17px/1.47 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1, h2, h3, p, ul { margin:0; padding:0; }
  ul { list-style:none; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--link); outline-offset:3px; border-radius:2px; }
  .wrap { max-width:980px; margin:0 auto; padding:0 22px; }
  .quiet { color:var(--quiet); }

  .bar {
    position:sticky; top:0; z-index:10; border-bottom:1px solid var(--hair);
    background:color-mix(in srgb, var(--paper) 78%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  }
  .bar-in { display:flex; align-items:center; gap:1.5rem; height:48px; font-size:.82rem; }
  .mark { color:var(--ink); font-weight:600; font-size:1rem; letter-spacing:-.01em; margin-right:auto; }
  .mark:hover { text-decoration:none; }
  .plain { background:none; border:0; padding:0; font:inherit; color:var(--link); cursor:pointer; }
  .plain:hover { text-decoration:underline; }
  .plain:disabled { color:var(--quiet); cursor:default; text-decoration:none; }

  .hero { text-align:center; padding:clamp(4rem,13vw,9rem) 0 clamp(3.5rem,10vw,7rem); }
  .hero h1 {
    color:var(--ink); font-weight:600; letter-spacing:-.035em; line-height:1.04;
    font-size:clamp(2.75rem,9vw,6rem); text-wrap:balance;
  }
  .hero .lede { margin-top:1.25rem; font-size:clamp(1.15rem,2.4vw,1.6rem); line-height:1.3; color:var(--quiet); text-wrap:balance; }
  .hero .act { margin-top:1.5rem; font-size:1.1rem; }

  .device { border-top:1px solid var(--hair); padding:clamp(3rem,8vw,5.5rem) 0 1rem; }
  .device h2 {
    color:var(--ink); font-weight:600; letter-spacing:-.025em; line-height:1.1;
    font-size:clamp(1.8rem,4.6vw,3rem); overflow-wrap:anywhere;
  }
  .device .sub { margin-top:.5rem; font-size:1.15rem; color:var(--quiet); }
  .part { display:grid; grid-template-columns:1fr; gap:1rem 2rem; padding:2.25rem 0; border-top:1px solid var(--hair); }
  .part:first-of-type { margin-top:2.75rem; }
  .part h3 { color:var(--ink); font-size:1.25rem; font-weight:600; letter-spacing:-.01em; }
  @media (min-width:760px) { .part { grid-template-columns:13rem 1fr; } }

  .attn li + li { margin-top:1.75rem; }
  .attn .t { color:var(--ink); font-size:1.3rem; font-weight:600; letter-spacing:-.012em; line-height:1.25; }
  .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:var(--bad); margin-right:.6rem; vertical-align:.18em; }
  .attn .d { margin-top:.3rem; color:var(--quiet); }

  .pass li { display:flex; align-items:baseline; gap:.6rem; padding:.3rem 0; break-inside:avoid; }
  .pass svg { flex:none; color:var(--ok); transform:translateY(.1em); }
  @media (min-width:760px) { .pass { columns:2; column-gap:2.5rem; } }

  .hist li { display:grid; grid-template-columns:1fr; gap:.1rem 1.5rem; padding:.95rem 0; border-top:1px solid var(--hair); }
  .hist li:first-child { border-top:0; padding-top:0; }
  .hist .w { color:var(--quiet); font-size:.9rem; }
  .hist .t { color:var(--ink); font-weight:600; }
  .hist .d { color:var(--quiet); }
  @media (min-width:560px) { .hist li { grid-template-columns:9.5rem 1fr; } .hist .w { padding-top:.12rem; } }

  footer { background:var(--mist); margin-top:4rem; padding:2.25rem 0 3rem; font-size:.82rem; color:var(--quiet); }
  footer p + p { margin-top:.6rem; }
</style>
</head>
<body>

<nav class="bar" aria-label="Site">
  <div class="wrap bar-in">
    <a class="mark" href="#top">EndpointForge</a>
    <span id="status" class="quiet" role="status" aria-live="polite"></span>
    <button id="refresh" class="plain" type="button">Refresh</button>
    <a href="https://github.com/subh-codes/endpointforge" rel="noopener">GitHub</a>
  </div>
</nav>

<main id="top">
  <section class="hero wrap">
    <h1 id="headline">Checking in with your devices.</h1>
    <p id="lede" class="lede">Live results, read only.</p>
    <p id="act" class="act"></p>
  </section>
  <div id="devices"></div>
  <noscript><p class="wrap quiet">This page needs JavaScript to load live results.</p></noscript>
</main>

<footer>
  <div class="wrap">
    <p>An agent on each device reports its security settings to Azure Functions. Each report is compared with a baseline, and every change is recorded and shown here.</p>
    <p>Built by Subhnetar Singh.
      <a href="https://github.com/subh-codes/endpointforge" rel="noopener">Source on GitHub</a>.
      <a href="https://www.linkedin.com/in/subh-yyc" rel="noopener">LinkedIn</a>.
    </p>
  </div>
</footer>

<script>
(function () {
  'use strict';

  const API = 'https://func-ef-qpszyaihq64bs.azurewebsites.net';
  const REFRESH_MS = 60000;   // refresh every minute
  const QUIET_MIN = 60;       // minutes without a report before a device counts as quiet
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const app = { controller: null, loaded: false };
  const headline = document.getElementById('headline');
  const lede = document.getElementById('lede');
  const act = document.getElementById('act');
  const deviceBox = document.getElementById('devices');
  const statusEl = document.getElementById('status');
  const refreshBtn = document.getElementById('refresh');

  /* ---------- helpers: all content is set with textContent, never as markup ---------- */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function tick() {
    const s = document.createElementNS(SVG_NS, 'svg');
    s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('width', '14'); s.setAttribute('height', '14');
    s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false');
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', 'M3 8.5l3.2 3.2L13 5'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor');
    p.setAttribute('stroke-width', '2'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
    s.appendChild(p);
    return s;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function platformName(p) { return p === 'windows' ? 'Windows' : (p === 'macos' ? 'macOS' : 'Unknown system'); }
  function parseDate(iso) {
    if (!iso) return null;
    const d = new Date(String(iso).replace(/(\.\d{3})\d+/, '$1'));   // keep 3 fractional digits for every browser
    return isNaN(d.getTime()) ? null : d;
  }
  function when(d) {
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' +
           d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function rel(d) {
    const s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (s < 45) return 'just now';
    if (s < 3600) return plural(Math.max(1, Math.round(s / 60)), 'minute', 'minutes') + ' ago';
    if (s < 86400) return plural(Math.round(s / 3600), 'hour', 'hours') + ' ago';
    return plural(Math.round(s / 86400), 'day', 'days') + ' ago';
  }
  function dur(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return plural(s, 'second', 'seconds');
    const m = Math.round(s / 60);
    if (m < 60) return plural(m, 'minute', 'minutes');
    const h = Math.round(m / 60);
    if (h < 24) return plural(h, 'hour', 'hours');
    return plural(Math.round(h / 24), 'day', 'days');
  }
  function has(v) { return v !== null && v !== undefined && v !== ''; }
  // "Expected True, found False." in plain words; a check that could not run says so.
  function finding(expected, actual) {
    if (actual === 'check-error') return 'The check could not run.';
    if (has(expected) && has(actual)) return 'Expected ' + expected + ', found ' + actual + '.';
    return '';
  }
  function priority(sev) { return sev ? sev.charAt(0).toUpperCase() + sev.slice(1) + ' priority.' : ''; }
  function join() { return Array.prototype.filter.call(arguments, Boolean).join(' '); }

  async function getJson(path, signal) {
    const r = await fetch(API + path, { signal: signal, cache: 'no-store' });
    if (!r.ok) throw new Error('status ' + r.status);
    return r.json();
  }

  /* ---------- history: fold each opened/resolved pair into one entry ---------- */
  function incidents(drift) {
    const list = [], open = {};
    for (let i = drift.length - 1; i >= 0; i--) {            // API returns newest first; walk oldest first
      const e = drift[i], t = parseDate(e.at);
      if (e.event === 'opened') {
        const inc = { ruleId: e.ruleId, title: e.title || e.ruleId, expected: e.expected, actual: e.actual, opened: t, resolved: null };
        list.push(inc); open[e.ruleId] = inc;
      } else if (open[e.ruleId]) {
        open[e.ruleId].resolved = t; open[e.ruleId].closed = true; delete open[e.ruleId];
      } else {
        list.push({ ruleId: e.ruleId, title: e.title || e.ruleId, opened: null, resolved: t, closed: true });
      }
    }
    return list.sort(function (a, b) { return (b.resolved || b.opened || 0) - (a.resolved || a.opened || 0); });
  }

  /* ---------- one device ---------- */
  function part(title, content) {
    const p = el('div', 'part');
    p.appendChild(el('h3', '', title));
    p.appendChild(content);
    return p;
  }

  function renderDevice(d) {
    const rules = Array.isArray(d.rules) ? d.rules : [];
    const failing = rules.filter(function (r) { return !r.pass; });
    const passing = rules.filter(function (r) { return r.pass; });
    const history = incidents(Array.isArray(d.drift) ? d.drift : []);
    const seen = parseDate(d.lastSeenUtc);
    const quiet = !seen || (Date.now() - seen.getTime()) > QUIET_MIN * 60000;

    const sec = el('section', 'device');
    const wrap = el('div', 'wrap');
    wrap.appendChild(el('h2', '', d.name));
    const sub = el('p', 'sub', join(platformName(d.platform) + '.',
      seen ? 'Last report ' + rel(seen) + '.' : 'No report yet.',
      seen && quiet ? 'This device has gone quiet.' : ''));
    if (seen) sub.title = seen.toLocaleString();
    wrap.appendChild(sub);

    if (failing.length) {
      const ul = el('ul', 'attn');
      failing.forEach(function (r) {
        const li = el('li');
        const t = el('p', 't');
        const dot = el('span', 'dot'); dot.setAttribute('aria-hidden', 'true');
        t.appendChild(dot);
        t.appendChild(document.createTextNode(r.title));
        li.appendChild(t);
        const inc = history.filter(function (x) { return x.ruleId === r.id && !x.closed; })[0];
        li.appendChild(el('p', 'd', join(priority(r.severity),
          inc ? finding(inc.expected, inc.actual) : '',
          inc && inc.opened ? 'Open since ' + when(inc.opened) + '.' : '')));
        li.appendChild(el('p', 'd', 'A fix you approve will run from here. Coming soon.'));
        ul.appendChild(li);
      });
      wrap.appendChild(part('Needs attention', ul));
    }

    if (passing.length) {
      const ul = el('ul', 'pass');
      passing.forEach(function (r) {
        const li = el('li');
        li.appendChild(tick());
        li.appendChild(el('span', '', r.title));
        ul.appendChild(li);
      });
      wrap.appendChild(part(failing.length ? 'Passing' : 'All checks pass', ul));
    }

    if (history.length) {
      const ul = el('ul', 'hist');
      history.forEach(function (x) {
        const li = el('li');
        const at = x.opened || x.resolved;
        li.appendChild(el('span', 'w', at ? when(at) : ''));
        const right = el('div');
        right.appendChild(el('p', 't', x.title));
        let end = '';
        if (x.closed && x.opened && x.resolved) end = 'Fixed in ' + dur(x.resolved - x.opened) + '.';
        else if (x.closed) end = 'Fixed.';
        else if (failing.some(function (r) { return r.id === x.ruleId; })) end = 'Still open.';
        right.appendChild(el('p', 'd', join(finding(x.expected, x.actual), end)));
        li.appendChild(right);
        ul.appendChild(li);
      });
      wrap.appendChild(part('History', ul));
    }

    sec.appendChild(wrap);
    return sec;
  }

  function deviceError(name) {
    const sec = el('section', 'device');
    const wrap = el('div', 'wrap');
    wrap.appendChild(el('h2', '', name));
    wrap.appendChild(el('p', 'sub', 'This device could not be loaded. Refresh to try again.'));
    sec.appendChild(wrap);
    return sec;
  }

  /* ---------- the opening statement ---------- */
  function say(head, sub, retry) {
    headline.textContent = head;
    lede.textContent = sub;
    act.replaceChildren();
    if (retry) {
      const b = el('button', 'plain', 'Try again');
      b.type = 'button';
      b.addEventListener('click', load);
      act.appendChild(b);
    }
  }

  function summarize(count, loaded) {
    let total = 0, pass = 0;
    loaded.forEach(function (d) {
      (d.rules || []).forEach(function (r) { total++; if (r.pass) pass++; });
    });
    if (!count) { say('No devices yet.', 'Results appear here as soon as an agent reports.'); return; }
    if (!total) { say('Waiting for the first report.', plural(count, 'device', 'devices') + ' registered.'); return; }
    const fail = total - pass;
    say(fail ? pass + ' of ' + total + ' checks pass.' : 'All ' + total + ' checks pass.',
        plural(count, 'device', 'devices') + ' reporting. ' +
        (fail ? plural(fail, 'check needs', 'checks need') + ' attention.' : 'Everything is in order.'));
  }

  /* ---------- load ---------- */
  async function load() {
    if (app.controller) app.controller.abort();        // a new load cancels the one in flight
    const controller = new AbortController();
    const signal = controller.signal;
    app.controller = controller;

    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Refreshing';
    const slow = setTimeout(function () {
      if (!signal.aborted && !app.loaded) lede.textContent = 'Waking the service. The first load takes a few seconds.';
    }, 3000);

    try {
      const list = await getJson('/api/devices', signal);
      const names = (list && Array.isArray(list.devices) ? list.devices : [])
        .map(function (x) { return x && x.name; }).filter(Boolean);
      const results = await Promise.all(names.map(function (n) {
        return getJson('/api/device?name=' + encodeURIComponent(n), signal).then(
          function (data) { return { ok: true, name: n, data: data }; },
          function () { return { ok: false, name: n }; });
      }));
      if (signal.aborted) return;

      summarize(names.length, results.filter(function (r) { return r.ok; }).map(function (r) { return r.data; }));
      const sections = results.map(function (r) { return r.ok ? renderDevice(r.data) : deviceError(r.name); });
      deviceBox.replaceChildren.apply(deviceBox, sections);
      app.loaded = true;
      statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } catch (err) {
      if (signal.aborted || (err && err.name === 'AbortError')) return;
      if (app.loaded) {
        statusEl.textContent = 'Refresh failed. Showing earlier results.';
      } else {
        say('Cannot reach the service.', 'It may still be starting. Give it a few seconds.', true);
      }
    } finally {
      clearTimeout(slow);
      if (app.controller === controller) { refreshBtn.disabled = false; refreshBtn.textContent = 'Refresh'; }
    }
  }

  refreshBtn.addEventListener('click', load);
  setInterval(load, REFRESH_MS);
  load();
})();
</script>
</body>
</html>
