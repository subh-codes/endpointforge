<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="EndpointForge: endpoint baseline compliance, reporting health and configuration drift history.">
<title>EndpointForge</title>
<script>
  // Apply the saved or system theme before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem('ef-theme'); } catch (e) { t = null; }
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --bg:#ffffff; --hover:#f5f6f7; --text:#1c1e21; --muted:#6a7078;
    --line:#e9ebee; --line-strong:#d3d7dc; --accent:#2f5bd3;
    --ok:#2b7d4f; --warn:#9a6500; --crit:#c0392b;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  }
  [data-theme="dark"] {
    --bg:#131416; --hover:#1b1d20; --text:#e6e7e9; --muted:#8f959d;
    --line:#25282c; --line-strong:#353a40; --accent:#8fb0ff;
    --ok:#56b983; --warn:#d9a441; --crit:#f0766a;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  h1, h2, p, dl, dd, dt { margin:0; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .mono { font-family:var(--mono); font-size:13px; }
  .num, .t { font-variant-numeric:tabular-nums; }
  .t { white-space:nowrap; }
  .muted { color:var(--muted); }
  .page { max-width:1200px; margin:0 auto; padding:0 24px; }

  /* shell */
  .top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
  .top-in { display:flex; align-items:stretch; gap:28px; min-height:48px; }
  .brand { display:flex; align-items:center; color:var(--text); font-weight:600; letter-spacing:-.01em; }
  .brand:hover { text-decoration:none; }
  .nav { display:flex; gap:20px; margin-right:auto; overflow-x:auto; }
  .nav a { display:flex; align-items:center; color:var(--muted); margin-bottom:-1px; border-bottom:1px solid transparent; white-space:nowrap; }
  .nav a:hover { color:var(--text); text-decoration:none; }
  .nav a[aria-current="page"] { color:var(--text); border-bottom-color:var(--text); }
  .tools { display:flex; align-items:center; gap:8px; }
  .sync { color:var(--muted); font-size:13px; white-space:nowrap; margin-right:6px; font-variant-numeric:tabular-nums; }
  .btn { background:none; border:1px solid var(--line-strong); border-radius:4px; padding:3px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn:disabled { color:var(--muted); cursor:default; background:none; }

  .head { padding:28px 0 20px; }
  .head h1 { font-size:18px; font-weight:600; letter-spacing:-.012em; line-height:1.3; overflow-wrap:anywhere; }
  .head h1:focus { outline:none; }
  .crumb { font-size:13px; color:var(--muted); margin-bottom:2px; }
  .crumb:empty { display:none; }
  main.page { padding-bottom:64px; min-height:60vh; }

  /* status marks: shape and text carry the meaning; colour is limited to the mark */
  .st { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .st::before { content:""; flex:none; width:7px; height:7px; box-sizing:border-box; }
  .st-reporting::before, .st-resolved::before, .st-ok::before, .st-synced::before { background:var(--ok); border-radius:50%; }
  .st-stale::before, .st-syncing::before { border:1.5px solid var(--warn); border-radius:50%; }
  .st-none::before, .st-unrecorded::before { border:1.5px dotted var(--muted); border-radius:50%; }
  .st-unavailable::before, .st-open::before, .st-bad::before, .st-failed::before { background:var(--crit); transform:rotate(45deg); }

  .sev { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .meter { display:inline-flex; align-items:flex-end; gap:2px; height:9px; }
  .meter i { width:2px; background:var(--line-strong); }
  .meter i:nth-child(1) { height:4px; } .meter i:nth-child(2) { height:6.5px; } .meter i:nth-child(3) { height:9px; }
  .meter i.on { background:var(--text); }

  /* fleet summary: four plain facts on one line */
  .summary { display:grid; grid-template-columns:repeat(4,max-content); gap:12px 64px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .summary dt { color:var(--muted); font-size:12px; }
  .summary dd { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.005em; }
  .summary dd span { font-size:13px; font-weight:400; color:var(--muted); margin-left:6px; letter-spacing:0; }
  .note { display:flex; align-items:baseline; gap:8px; margin-top:12px; color:var(--muted); font-size:13px; }
  .note::before { content:""; flex:none; width:7px; height:7px; border:1.5px solid var(--warn); border-radius:50%; }
  .note-crit::before { border:0; border-radius:0; background:var(--crit); transform:rotate(45deg); }
  .note .btn { margin-left:8px; color:var(--text); }

  /* sections and tables: no boxes, only hairlines; first and last columns align with the page edge */
  .sec { margin-top:40px; }
  .sec-h { display:flex; align-items:baseline; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .sec-h h2 { font-size:13px; font-weight:600; }
  .sec-h .count { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .sec-h a { margin-left:auto; font-size:13px; }
  .tbl-wrap { overflow-x:auto; }
  .tbl { width:100%; border-collapse:collapse; }
  .tbl th { text-align:left; font-weight:400; font-size:12px; color:var(--muted); padding:8px 24px 8px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl td { padding:10px 24px 10px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl th:last-child, .tbl td:last-child { padding-right:0; }
  .tbl .r { text-align:right; }
  .tbl .name { color:var(--text); font-weight:500; overflow-wrap:break-word; }
  .tbl a.name { display:inline-block; max-width:30ch; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; }
  .tbl a.name:hover { color:var(--accent); }
  .nw { white-space:nowrap; }
  .sub { display:block; font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:1px; }
  .sort { background:none; border:0; padding:0; cursor:pointer; color:inherit; font:inherit; display:inline-flex; gap:6px; align-items:center; }
  .sort:hover { color:var(--text); }
  .sort span { width:0; height:0; border-left:3.5px solid transparent; border-right:3.5px solid transparent; }
  .sort .asc { border-bottom:4.5px solid currentColor; }
  .sort .desc { border-top:4.5px solid currentColor; }
  .empty { padding:14px 0; color:var(--muted); border-bottom:1px solid var(--line); }
  .foot { margin-top:10px; color:var(--muted); font-size:13px; }

  .controls { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
  .controls label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .controls input, .controls select { background:var(--bg); color:var(--text); border:1px solid var(--line-strong); border-radius:4px; padding:5px 9px; min-height:32px; min-width:220px; font-size:14px; }
  .controls input::placeholder { color:var(--muted); }

  /* device detail */
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:0 64px; }
  .kv h2 { font-size:13px; font-weight:600; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .kv > div { display:grid; grid-template-columns:140px 1fr; gap:16px; padding:9px 0; border-bottom:1px solid var(--line); }
  .kv dt { color:var(--muted); }
  details.fold > summary { cursor:pointer; font-size:13px; font-weight:600; padding-bottom:8px; border-bottom:1px solid var(--line); }
  details.fold > summary .count { color:var(--muted); font-weight:400; margin-left:8px; }

  .panel { padding:8px 0; max-width:560px; }
  .panel h2 { font-size:14px; font-weight:600; margin-bottom:2px; }
  .panel .btn { margin-top:14px; }

  footer { border-top:1px solid var(--line); padding:16px 0 32px; color:var(--muted); font-size:12px; }
  footer .page { display:flex; flex-wrap:wrap; gap:4px 24px; justify-content:space-between; }
  footer a { color:var(--muted); text-decoration:underline; text-underline-offset:2px; }
  footer a:hover { color:var(--text); }

  @media (max-width:760px) {
    .page { padding:0 16px; }
    .top-in { flex-wrap:wrap; gap:0 16px; }
    .brand { min-height:44px; }
    .nav { order:3; width:100%; min-height:40px; gap:20px; }
    .tools { margin-left:auto; }
    .sync .long { display:none; }
    .summary { grid-template-columns:1fr 1fr; gap:14px 24px; }
    .facts { grid-template-columns:1fr; gap:32px 0; }
    .kv > div { grid-template-columns:120px 1fr; }
    .controls label, .controls input, .controls select { width:100%; min-width:0; }
    /* each table row becomes one labelled record */
    .tbl thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .tbl, .tbl tbody, .tbl tr, .tbl td { display:block; }
    .tbl tr { padding:12px 0; border-bottom:1px solid var(--line); }
    .tbl td { display:grid; grid-template-columns:120px 1fr; gap:16px; padding:3px 0; border:0; text-align:left; }
    .tbl td::before { content:attr(data-label); color:var(--muted); font-size:12px; padding-top:2px; }
    .tbl .r { text-align:left; }
    .tbl a.name { max-width:100%; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="page top-in">
    <a class="brand" href="#/overview">EndpointForge</a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/devices" data-route="devices">Devices</a>
      <a href="#/findings" data-route="findings">Findings</a>
      <a href="#/activity" data-route="activity">Activity</a>
    </nav>
    <div class="tools">
      <span class="sync" id="sync" role="status" aria-live="polite"></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn" id="theme" type="button" aria-pressed="false">Dark mode</button>
    </div>
  </div>
</header>

<main class="page" id="main">
  <div class="head">
    <div class="crumb" id="crumb"></div>
    <h1 id="title" tabindex="-1">Fleet overview</h1>
  </div>
  <div id="view"></div>
  <noscript><div class="panel"><h2>JavaScript is required</h2><p class="muted">This interface reads device data from the EndpointForge API.</p></div></noscript>
</main>

<footer>
  <div class="page">
    <span>Read-only view. Data is polled every 60 seconds. <span id="tz"></span></span>
    <span>Built by Subhnetar Singh.
      <a href="https://github.com/subh-codes/endpointforge" rel="noopener">Source</a> |
      <a href="https://www.linkedin.com/in/subh-yyc" rel="noopener">LinkedIn</a>
    </span>
  </div>
</footer>

<script>
(function () {
  'use strict';

  const API = 'https://func-ef-qpszyaihq64bs.azurewebsites.net';
  const POLL_MS = 60000;            // polling interval
  const STALE_MS = 60 * 60000;      // a device is stale after 60 minutes without a report
  const SEV_RANK = { high: 3, medium: 2, low: 1 };
  const REPORT_LABEL = { reporting: 'Reporting', stale: 'Stale', none: 'No report received', unavailable: 'Reporting unavailable' };
  const TITLES = { overview: 'Fleet overview', devices: 'Devices', findings: 'Active findings', activity: 'Activity' };

  const state = {
    phase: 'loading',               // loading | ready | failed
    slow: false,                    // first response is taking longer than 3 seconds
    syncing: false,
    devices: [],
    lastSync: null,
    syncError: null,                // { at: Date, text: string } when the latest poll failed
    ui: { q: '', report: 'all', sortKey: 'name', sortDir: 1, sev: 'all' }
  };
  let controller = null;
  let seq = 0;
  let lastRoute = '';

  const $ = function (id) { return document.getElementById(id); };
  const viewEl = $('view'), titleEl = $('title'), crumbEl = $('crumb'), syncEl = $('sync');
  const refreshBtn = $('refresh'), themeBtn = $('theme');

  /* ---------- DOM helper: text is always inserted as text nodes, never parsed as markup ---------- */
  function h(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = String(v);
        else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : String(v));
      });
    }
    if (kids !== null && kids !== undefined) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
      });
    }
    return n;
  }

  /* ---------- formatting ---------- */
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function clock(d) { return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
  function tzLabel() {
    const m = -new Date().getTimezoneOffset(), a = Math.abs(m);
    return 'UTC' + (m < 0 ? '-' : '+') + p2(Math.floor(a / 60)) + ':' + p2(a % 60);
  }
  function parseDate(iso) {
    if (!iso) return null;
    const d = new Date(String(iso).replace(/(\.\d{3})\d+/, '$1'));   // 3 fractional digits parse in every browser
    return isNaN(d.getTime()) ? null : d;
  }
  function rel(d) {
    const s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (s < 60) return 'under a minute ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' d ago';
  }
  function dur(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + ' s';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' min ' + (s % 60) + ' s';
    const hr = Math.floor(m / 60);
    if (hr < 24) return hr + ' h ' + (m % 60) + ' min';
    return Math.floor(hr / 24) + ' d ' + (hr % 24) + ' h';
  }
  function val(v) { return v === null || v === undefined || v === '' ? null : String(v); }
  function normSev(s) { s = String(s || '').toLowerCase(); return SEV_RANK[s] ? s : ''; }
  function osName(p) { return p === 'windows' ? 'Windows' : (p === 'macos' ? 'macOS' : 'Not reported'); }
  function errText(err) {
    if (!err) return 'Unknown error';
    if (err.name === 'TypeError') return 'Network request failed';
    return err.message || 'Unknown error';
  }
  function time(x) { const d = x.opened || x.resolved; return d ? d.getTime() : 0; }

  /* ---------- cells ---------- */
  function none(text) { return h('span', { class: 'muted', text: text || 'Not recorded' }); }
  function ts(d) {
    if (!d) return none();
    const date = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
    return h('time', { class: 't', datetime: d.toISOString(), title: d.toISOString() + ' (UTC), ' + rel(d) },
      [h('span', { class: 'muted', text: date + ' ' }), clock(d)]);
  }
  function value(v) { return v === null ? none() : h('span', { class: 'mono', text: v }); }
  function reportCell(r) { return h('span', { class: 'st st-' + r, text: REPORT_LABEL[r] }); }
  function sevCell(sev) {
    if (!sev) return none('Not set');
    const rank = SEV_RANK[sev];
    const meter = h('span', { class: 'meter', 'aria-hidden': 'true' },
      [1, 2, 3].map(function (i) { return h('i', { class: i <= rank ? 'on' : null }); }));
    return h('span', { class: 'sev' }, [meter, sev.charAt(0).toUpperCase() + sev.slice(1)]);
  }
  function complianceCell(d) {
    if (d.pct === null) return none('Not evaluated');
    const kids = [h('span', { class: 'num', text: d.pct + '%' })];
    if (d.lastKnown) kids.push(h('span', { class: 'muted', text: ' last known' }));
    return h('span', { class: 'nw' }, kids);
  }
  function stateCell(s) {
    if (s === 'open') return h('span', { class: 'st st-open', text: 'Open' });
    if (s === 'resolved') return h('span', { class: 'st st-resolved', text: 'Resolved' });
    return h('span', { class: 'st st-unrecorded', text: 'Resolution not recorded' });
  }
  function deviceLink(d) {
    return h('a', { class: 'name', href: '#/devices/' + encodeURIComponent(d.name), title: d.name, text: d.name });
  }

  /* ---------- data model ---------- */
  // Correlate drift events into incidents. Events arrive newest first; walk oldest first.
  // An "opened" event stays unresolved until a later "resolved" event for the same rule.
  // History is capped per device, so an incident with no recorded resolution is only called
  // "open" when its rule is failing right now; otherwise its resolution is simply not recorded.
  function correlate(drift, failingIds) {
    const list = [], open = {};
    for (let i = drift.length - 1; i >= 0; i--) {
      const e = drift[i];
      if (!e || !e.ruleId) continue;
      const id = String(e.ruleId), t = parseDate(e.at);
      const base = { ruleId: id, title: val(e.title) || id, severity: normSev(e.severity) };
      if (e.event === 'opened') {
        const inc = Object.assign(base, { expected: val(e.expected), observed: val(e.actual), opened: t, resolved: null, state: 'unrecorded' });
        list.push(inc);
        open[id] = inc;                       // a repeated "opened" leaves the earlier incident unrecorded
      } else if (e.event === 'resolved') {
        if (open[id]) { open[id].resolved = t; open[id].state = 'resolved'; delete open[id]; }
        else list.push(Object.assign(base, { expected: null, observed: null, opened: null, resolved: t, state: 'resolved' }));
      }
    }
    Object.keys(open).forEach(function (id) { if (failingIds.indexOf(id) !== -1) open[id].state = 'open'; });
    return list.sort(function (a, b) { return time(b) - time(a); });
  }

  function toDevice(entry, res, prev) {
    const base = { name: entry.name, platform: entry.platform || (prev ? prev.platform : ''), firstSeen: parseDate(entry.firstSeenUtc) };
    if (!res.ok) {
      // Keep the last successful data for this device, clearly marked as last known.
      if (prev && prev.hasData) return Object.assign({}, prev, base, { report: 'unavailable', lastKnown: true, error: res.error });
      return Object.assign(base, { hasData: false, report: 'unavailable', lastKnown: false, error: res.error,
        rules: [], passing: [], failing: [], incidents: [], seen: null, pct: null });
    }
    const d = res.data || {};
    const rules = (Array.isArray(d.rules) ? d.rules : []).filter(function (r) { return r && r.id; }).map(function (r) {
      return { id: String(r.id), title: val(r.title) || String(r.id), severity: normSev(r.severity), pass: r.pass === true };
    });
    const failing = rules.filter(function (r) { return !r.pass; });
    const passing = rules.filter(function (r) { return r.pass; });
    const seen = parseDate(d.lastSeenUtc);
    const report = !seen ? 'none' : (Date.now() - seen.getTime() > STALE_MS ? 'stale' : 'reporting');
    return Object.assign(base, {
      platform: d.platform || base.platform, hasData: true, error: null,
      report: report, lastKnown: report !== 'reporting',
      rules: rules, passing: passing, failing: failing, seen: seen,
      pct: rules.length ? Math.round(passing.length / rules.length * 100) : null,
      incidents: correlate(Array.isArray(d.drift) ? d.drift : [], failing.map(function (r) { return r.id; }))
    });
  }

  function fleet() {
    const f = { registered: state.devices.length, reporting: 0, evaluated: 0, passing: 0, failing: 0, high: 0 };
    state.devices.forEach(function (d) {
      if (d.report === 'reporting') f.reporting++;
      f.evaluated += d.rules.length; f.passing += d.passing.length; f.failing += d.failing.length;
      f.high += d.failing.filter(function (r) { return r.severity === 'high'; }).length;
    });
    f.notReporting = f.registered - f.reporting;
    f.pct = f.evaluated ? Math.round(f.passing / f.evaluated * 100) : null;
    return f;
  }
  function allFindings() {
    const out = [];
    state.devices.forEach(function (d) {
      d.failing.forEach(function (r) {
        const inc = d.incidents.filter(function (i) { return i.ruleId === r.id && i.state === 'open'; })[0] || null;
        out.push({ device: d, rule: r, expected: inc ? inc.expected : null, observed: inc ? inc.observed : null, first: inc ? inc.opened : null });
      });
    });
    return out.sort(function (a, b) {
      return (SEV_RANK[b.rule.severity] || 0) - (SEV_RANK[a.rule.severity] || 0) ||
             (a.first ? a.first.getTime() : Infinity) - (b.first ? b.first.getTime() : Infinity);
    });
  }
  function allActivity() {
    const out = [];
    state.devices.forEach(function (d) { d.incidents.forEach(function (i) { out.push(Object.assign({ device: d }, i)); }); });
    return out.sort(function (a, b) { return time(b) - time(a); });
  }

  /* ---------- building blocks ---------- */
  function table(caption, cols, rows, emptyText) {
    if (!rows.length) return h('p', { class: 'empty', text: emptyText });
    const head = h('tr', null, cols.map(function (c) {
      return h('th', Object.assign({ scope: 'col', class: c.cls || null }, c.th || {}), c.head || c.label);
    }));
    const body = rows.map(function (r) {
      return h('tr', null, cols.map(function (c) { return h('td', { 'data-label': c.label, class: c.cls || null }, c.cell(r)); }));
    });
    return h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
      [h('caption', { class: 'vh', text: caption }), h('thead', null, head), h('tbody', null, body)]));
  }
  function section(title, count, body, link) {
    return h('section', { class: 'sec' }, [
      h('div', { class: 'sec-h' }, [
        h('h2', { text: title }),
        count === null ? null : h('span', { class: 'count', text: count }),
        link ? h('a', { href: link.href, text: link.text }) : null
      ]),
      body
    ]);
  }
  function select(id, label, options, current, onchange) {
    const s = h('select', { id: id, onchange: function (e) { onchange(e.target.value); } },
      options.map(function (o) { return h('option', { value: o[0], text: o[1] }); }));
    s.value = current;
    return h('label', null, [label, s]);
  }

  function deviceCols(sortable) {
    function head(label, key) {
      if (!sortable) return { label: label };
      const on = state.ui.sortKey === key;
      return {
        label: label,
        th: { 'aria-sort': on ? (state.ui.sortDir === 1 ? 'ascending' : 'descending') : 'none' },
        head: h('button', { class: 'sort', type: 'button', onclick: function () {
          state.ui.sortDir = on ? -state.ui.sortDir : 1; state.ui.sortKey = key; render();
        } }, [label, h('span', { 'aria-hidden': 'true', class: on ? (state.ui.sortDir === 1 ? 'asc' : 'desc') : null })])
      };
    }
    return [
      Object.assign(head('Device', 'name'), { cell: deviceLink }),
      Object.assign(head('Operating system', 'os'), { cell: function (d) { return osName(d.platform); } }),
      Object.assign(head('Reporting', 'report'), { cell: function (d) { return reportCell(d.report); } }),
      Object.assign(head('Last reported', 'seen'), { cell: function (d) { return ts(d.seen); } }),
      Object.assign(head('Compliance', 'pct'), { cell: complianceCell }),
      Object.assign(head('Passing', 'passing'), { cls: 'r num', cell: function (d) { return d.hasData ? d.passing.length : none('n/a'); } }),
      Object.assign(head('Failing', 'failing'), { cls: 'r num', cell: function (d) { return d.hasData ? d.failing.length : none('n/a'); } })
    ];
  }
  function findingCols(withDevice) {
    const cols = [
      { label: 'Rule', cell: function (f) { return h('span', null, [h('span', { class: 'name', text: f.rule.title }), h('span', { class: 'sub', text: f.rule.id })]); } },
      { label: 'Severity', cell: function (f) { return sevCell(f.rule.severity); } },
      { label: 'Expected value', cell: function (f) { return value(f.expected); } },
      { label: 'Observed value', cell: function (f) { return value(f.observed); } },
      { label: 'First observed', cell: function (f) { return ts(f.first); } },
      { label: 'State', cell: function () { return stateCell('open'); } }
    ];
    if (withDevice) cols.unshift({ label: 'Device', cell: function (f) { return deviceLink(f.device); } });
    return cols;
  }
  function activityCols(withDevice, compact) {
    let cols = [
      { label: 'Drift opened', cell: function (i) { return i.opened ? ts(i.opened) : none('Before recorded history'); } },
      { label: 'Rule', cell: function (i) { return h('span', { class: 'name', text: i.title }); } },
      { label: 'Expected value', cell: function (i) { return value(i.expected); } },
      { label: 'Observed value', cell: function (i) { return value(i.observed); } },
      { label: 'State', cell: function (i) { return stateCell(i.state); } },
      { label: 'Resolved', cell: function (i) { return i.resolved ? ts(i.resolved) : none(i.state === 'open' ? 'Not resolved' : 'Not recorded'); } },
      { label: 'Time to resolution', cls: 'r num', cell: function (i) { return i.opened && i.resolved ? dur(i.resolved - i.opened) : none('n/a'); } }
    ];
    if (compact) cols = cols.filter(function (c) { return c.label !== 'Expected value' && c.label !== 'Observed value' && c.label !== 'Resolved'; });
    if (withDevice) cols.splice(1, 0, { label: 'Device', cell: function (i) { return deviceLink(i.device); } });
    return cols;
  }

  function syncNote() {
    if (!state.syncError || state.phase !== 'ready') return null;
    return h('p', { class: 'note note-crit' }, [
      'Refresh failed at ' + clock(state.syncError.at) + ' (' + state.syncError.text + '). Showing data from the last successful sync at ' +
      (state.lastSync ? clock(state.lastSync) : 'an earlier time') + '.',
      h('button', { class: 'btn', type: 'button', onclick: load }, 'Retry')
    ]);
  }

  /* ---------- views ---------- */
  function viewOverview() {
    const f = fleet();
    function item(label, v, suffix) {
      return h('div', null, [h('dt', { text: label }), h('dd', null, [String(v), suffix ? h('span', { text: suffix }) : null])]);
    }
    const strip = h('dl', { class: 'summary' }, [
      item('Devices', f.reporting + ' of ' + f.registered, 'reporting'),
      item('Checks', f.evaluated ? f.passing + ' of ' + f.evaluated : 'None', f.evaluated ? 'passing' : 'evaluated'),
      item('Open findings', f.failing, f.failing ? f.high + ' high severity' : null),
      item('Compliance', f.pct === null ? 'n/a' : f.pct + '%', f.pct === null ? null : (f.notReporting ? 'includes last known' : 'from latest reports'))
    ]);
    const findings = allFindings(), activity = allActivity();
    return [
      syncNote(),
      strip,
      f.notReporting ? h('p', { class: 'note' }, f.notReporting + (f.notReporting === 1 ? ' device is' : ' devices are') +
        ' not reporting. Check counts and compliance for ' + (f.notReporting === 1 ? 'that device' : 'those devices') +
        ' reflect the last report received, not current state.') : null,
      section('Active findings', findings.length, table('Active findings', findingCols(true), findings.slice(0, 8),
        f.evaluated ? 'No active findings. Every evaluated check is passing.' : 'No checks have been evaluated yet.'),
        findings.length > 8 ? { href: '#/findings', text: 'All findings' } : null),
      section('Devices', state.devices.length, table('Devices', deviceCols(false), state.devices,
        'No devices are registered. A device appears here after its agent sends a first report.'),
        { href: '#/devices', text: 'Device inventory' }),
      section('Recent configuration drift', null, table('Recent configuration drift', activityCols(true, true), activity.slice(0, 5),
        'No configuration drift has been recorded.'), activity.length ? { href: '#/activity', text: 'All activity' } : null)
    ];
  }

  function viewDevices() {
    const ui = state.ui, q = ui.q.trim().toLowerCase();
    const keyOf = {
      name: function (d) { return d.name.toLowerCase(); },
      os: function (d) { return osName(d.platform); },
      report: function (d) { return REPORT_LABEL[d.report]; },
      seen: function (d) { return d.seen ? d.seen.getTime() : 0; },
      pct: function (d) { return d.pct === null ? -1 : d.pct; },
      passing: function (d) { return d.passing.length; },
      failing: function (d) { return d.failing.length; }
    }[ui.sortKey];
    const rows = state.devices.filter(function (d) {
      if (q && d.name.toLowerCase().indexOf(q) === -1) return false;
      if (ui.report === 'reporting') return d.report === 'reporting';
      if (ui.report === 'not') return d.report !== 'reporting';
      if (ui.report === 'findings') return d.failing.length > 0;
      return true;
    }).sort(function (a, b) {
      const x = keyOf(a), y = keyOf(b);
      return (x < y ? -1 : x > y ? 1 : 0) * ui.sortDir || a.name.localeCompare(b.name);
    });
    const search = h('input', { id: 'q', type: 'search', value: ui.q, placeholder: 'Device name', autocomplete: 'off',
      oninput: function (e) { ui.q = e.target.value; render(); } });
    return [
      syncNote(),
      h('div', { class: 'controls' }, [
        h('label', null, ['Search', search]),
        select('f-report', 'Show', [['all', 'All devices'], ['reporting', 'Reporting'], ['not', 'Not reporting'], ['findings', 'With open findings']],
          ui.report, function (v) { ui.report = v; render(); })
      ]),
      table('Device inventory', deviceCols(true), rows, state.devices.length
        ? 'No devices match the current search and filter.'
        : 'No devices are registered. A device appears here after its agent sends a first report.'),
      h('p', { class: 'foot', text: rows.length + ' of ' + state.devices.length + ' devices shown.' })
    ];
  }

  function viewDevice(name) {
    const d = state.devices.filter(function (x) { return x.name === name; })[0];
    if (!d) {
      return h('div', { class: 'panel' }, [h('h2', { text: 'Device not found' }),
        h('p', { class: 'muted', text: 'No registered device is named "' + name + '".' }),
        h('p', null, h('a', { href: '#/devices', text: 'Back to devices' }))]);
    }
    function row(label, content) { return h('div', null, [h('dt', { text: label }), h('dd', null, content)]); }
    const result = d.pct === null ? none('Not evaluated')
      : (d.failing.length ? h('span', { class: 'st st-bad', text: 'Non-compliant' }) : h('span', { class: 'st st-ok', text: 'Compliant' }));
    const findings = d.failing.map(function (r) {
      const inc = d.incidents.filter(function (i) { return i.ruleId === r.id && i.state === 'open'; })[0] || null;
      return { device: d, rule: r, expected: inc ? inc.expected : null, observed: inc ? inc.observed : null, first: inc ? inc.opened : null };
    }).sort(function (a, b) { return (SEV_RANK[b.rule.severity] || 0) - (SEV_RANK[a.rule.severity] || 0); });
    const passCols = [
      { label: 'Rule', cell: function (r) { return h('span', null, [r.title, h('span', { class: 'sub', text: r.id })]); } },
      { label: 'Severity', cell: function (r) { return sevCell(r.severity); } },
      { label: 'State', cell: function () { return h('span', { class: 'st st-ok', text: 'Passing' }); } }
    ];
    return [
      syncNote(),
      d.report === 'unavailable' ? h('p', { class: 'note note-crit', text: 'The latest report for this device could not be retrieved (' +
        (d.error || 'unknown error') + ').' + (d.hasData ? ' Values below are from the last successful sync.' : '') }) : null,
      d.report === 'stale' ? h('p', { class: 'note', text: 'This device has not reported for over 60 minutes. Values below reflect its last report and may not match current state.' }) : null,
      h('div', { class: 'facts' }, [
        h('dl', { class: 'kv' }, [
          h('h2', { text: 'Report health' }),
          row('Status', reportCell(d.report)),
          row('Last reported', d.seen ? h('span', null, [ts(d.seen), h('span', { class: 'muted', text: ' (' + rel(d.seen) + ')' })]) : none('No report received')),
          row('Operating system', osName(d.platform)),
          row('First registered', ts(d.firstSeen))
        ]),
        h('dl', { class: 'kv' }, [
          h('h2', { text: 'Compliance' }),
          row('Result', h('span', null, [result, d.lastKnown && d.pct !== null ? h('span', { class: 'muted', text: '  last known' }) : null])),
          row('Checks passing', d.rules.length ? h('span', { class: 'num', text: d.passing.length + ' of ' + d.rules.length }) : none('Not evaluated')),
          row('Compliance', complianceCell(d)),
          row('Open findings', h('span', { class: 'num', text: d.failing.length }))
        ])
      ]),
      section('Active findings', findings.length, table('Active findings for ' + d.name, findingCols(false), findings,
        d.rules.length ? 'No active findings. Every evaluated check is passing.' : 'No checks have been evaluated for this device.')),
      findings.length ? h('p', { class: 'foot', text: 'Approved remediation is planned and is not available in this version.' }) : null,
      d.passing.length ? h('section', { class: 'sec' }, h('details', { class: 'fold' }, [
        h('summary', null, ['Passing baseline checks', h('span', { class: 'count num', text: d.passing.length })]),
        table('Passing baseline checks for ' + d.name, passCols, d.passing, '')
      ])) : null,
      section('Configuration drift history', d.incidents.length, table('Configuration drift history for ' + d.name,
        activityCols(false), d.incidents, 'No configuration drift has been recorded for this device.')),
      h('p', { class: 'foot', text: 'History covers the 25 most recent drift events for this device.' })
    ];
  }

  function viewFindings() {
    const sev = state.ui.sev;
    const rows = allFindings().filter(function (f) { return sev === 'all' || f.rule.severity === sev; });
    return [
      syncNote(),
      h('div', { class: 'controls' }, [
        select('f-sev', 'Severity', [['all', 'All severities'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']],
          sev, function (v) { state.ui.sev = v; render(); })
      ]),
      table('Active findings', findingCols(true), rows, sev === 'all'
        ? 'No active findings. Every evaluated check is passing.' : 'No active findings at this severity.'),
      h('p', { class: 'foot', text: 'A finding is a baseline check that failed in the latest report from a device. Approved remediation is planned and is not available in this version.' })
    ];
  }

  function viewActivity() {
    return [
      syncNote(),
      table('Configuration drift activity', activityCols(true), allActivity(), 'No configuration drift has been recorded.'),
      h('p', { class: 'foot', text: 'Each row pairs a drift event with its resolution. History covers the 25 most recent drift events per device.' })
    ];
  }

  function viewLoading() {
    return h('div', { class: 'panel' }, [
      h('h2', { text: 'Loading device inventory' }),
      h('p', { class: 'muted', text: state.slow ? 'The API is starting. A first response can take up to 10 seconds.' : 'Requesting devices from the API.' })
    ]);
  }
  function viewFailed() {
    return h('div', { class: 'panel' }, [
      h('h2', { text: 'Device inventory unavailable' }),
      h('p', { class: 'muted', text: 'The API did not return data (' + (state.syncError ? state.syncError.text : 'unknown error') + '). No earlier results are available to show.' }),
      h('button', { class: 'btn', type: 'button', onclick: function () { state.phase = 'loading'; load(); } }, 'Retry')
    ]);
  }

  /* ---------- routing and render ---------- */
  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    const name = TITLES[parts[0]] ? parts[0] : 'overview';
    let device = null;
    if (name === 'devices' && parts.length > 1 && parts[1]) {
      try { device = decodeURIComponent(parts.slice(1).join('/')); } catch (e) { device = parts[1]; }
    }
    return { name: name, device: device };
  }

  function paintSync() {
    let cls = 'st st-syncing', text = 'Syncing';
    if (!state.syncing) {
      if (state.syncError) { cls = 'st st-failed'; text = 'Sync failed ' + clock(state.syncError.at); }
      else if (state.lastSync) { cls = 'st st-synced'; text = 'Synced ' + clock(state.lastSync); }
      else { cls = 'st st-none'; text = 'Not synced'; }
    }
    syncEl.replaceChildren(h('span', { class: cls }, [h('span', { class: 'long', text: text })]));
    syncEl.firstChild.title = text;
    refreshBtn.disabled = state.syncing;
  }

  function render() {
    const r = route();
    const key = r.name + '/' + (r.device || '');
    // Keep keyboard focus and caret in place when the view is rebuilt.
    const active = document.activeElement, keepId = active && viewEl.contains(active) ? active.id : '';
    const caret = keepId && active.selectionStart !== undefined ? active.selectionStart : null;

    const title = r.device || TITLES[r.name];
    titleEl.textContent = title;
    document.title = title + ' | EndpointForge';
    crumbEl.replaceChildren.apply(crumbEl, r.device ? [h('a', { href: '#/devices', text: 'Devices' }), ' / ' + r.device] : []);
    Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) {
      if (a.getAttribute('data-route') === r.name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    let content;
    if (state.phase === 'loading') content = viewLoading();
    else if (state.phase === 'failed') content = viewFailed();
    else if (r.device) content = viewDevice(r.device);
    else content = { overview: viewOverview, devices: viewDevices, findings: viewFindings, activity: viewActivity }[r.name]();
    const nodes = (Array.isArray(content) ? content : [content]).filter(Boolean);
    viewEl.replaceChildren.apply(viewEl, nodes);

    if (keepId) {
      const again = $(keepId);
      if (again) { again.focus(); if (caret !== null) { try { again.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ } } }
    }
    if (key !== lastRoute) {
      if (lastRoute) { window.scrollTo(0, 0); titleEl.focus(); }
      lastRoute = key;
    }
    paintSync();
  }

  /* ---------- data loading ---------- */
  async function getJson(path, signal) {
    const r = await fetch(API + path, { signal: signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function load() {
    if (controller) controller.abort();                 // cancel the request in flight
    const my = ++seq;                                   // only the newest load may write state
    controller = new AbortController();
    const signal = controller.signal;
    state.syncing = true;
    state.slow = false;
    render();
    const slowTimer = setTimeout(function () {
      if (my === seq && state.phase === 'loading') { state.slow = true; render(); }
    }, 3000);

    try {
      const list = await getJson('/api/devices', signal);
      const seen = {};
      const entries = (list && Array.isArray(list.devices) ? list.devices : []).filter(function (x) {
        if (!x || typeof x.name !== 'string' || !x.name || seen[x.name]) return false;
        seen[x.name] = true;
        return true;
      });
      // One device failing to load must not affect the others.
      const results = await Promise.all(entries.map(function (e) {
        return getJson('/api/device?name=' + encodeURIComponent(e.name), signal).then(
          function (data) { return { ok: true, data: data }; },
          function (err) { return { ok: false, error: errText(err) }; });
      }));
      if (my !== seq || signal.aborted) return;
      const prev = {};
      state.devices.forEach(function (d) { prev[d.name] = d; });
      state.devices = entries.map(function (e, i) { return toDevice(e, results[i], prev[e.name]); });
      state.phase = 'ready';
      state.lastSync = new Date();
      state.syncError = null;
    } catch (err) {
      if (my !== seq || (err && err.name === 'AbortError')) return;
      state.syncError = { at: new Date(), text: errText(err) };
      if (state.phase !== 'ready') state.phase = 'failed';   // keep earlier results when a refresh fails
    } finally {
      clearTimeout(slowTimer);
      if (my === seq) { state.syncing = false; render(); }
    }
  }

  /* ---------- theme ---------- */
  function paintTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }
  themeBtn.addEventListener('click', function () {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ef-theme', next); } catch (e) { /* storage unavailable: applies to this visit only */ }
    paintTheme();
  });

  /* ---------- start ---------- */
  $('tz').textContent = 'Times are local (' + tzLabel() + ').';
  paintTheme();
  refreshBtn.addEventListener('click', load);
  window.addEventListener('hashchange', render);
  setInterval(load, POLL_MS);
  load();
})();
</script>
</body>
</html>
